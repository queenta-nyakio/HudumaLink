
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leave a Review - HudumaLink</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>

    <nav class="navbar">
        <div class="logo">HudumaLink</div>
        <div class="nav-links">
            <a href="{{ url_for('user_dashboard') }}">Dashboard</a>
            <a href="{{ url_for('my_requests') }}">My Requests</a>
            <a href="{{ url_for('logout') }}">Logout</a>
        </div>
    </nav>

    <section class="dashboard-header">
        <div class="dashboard-container">
            <h1>Leave a Review</h1>
            <p>Share your experience with this service provider.</p>
        </div>
    </section>

    <section class="dashboard-section">
        <div class="dashboard-container">
            <div class="dashboard-card">
                <h2>{{ service_request["service_name"] }}</h2>
                <p>
                    <strong>Provider:</strong>
                    {{ service_request["provider_name"] }}
                </p>

                <form method="POST"
                      action="{{ url_for('review_request', request_id=service_request['id']) }}">

                    
<div class="form-group">
    <label>Rate your experience</label>

    <div class="star-rating" role="group" aria-label="Rate from 1 to 5 stars">
        <input type="radio" id="star5" name="rating" value="5" required>
        <label for="star5" title="5 stars">★</label>

        <input type="radio" id="star4" name="rating" value="4">
        <label for="star4" title="4 stars">★</label>

        <input type="radio" id="star3" name="rating" value="3">
        <label for="star3" title="3 stars">★</label>

        <input type="radio" id="star2" name="rating" value="2">
        <label for="star2" title="2 stars">★</label>

        <input type="radio" id="star1" name="rating" value="1">
        <label for="star1" title="1 star">★</label>
    </div>

    <p class="rating-help">Click a star to rate from 1 to 5.</p>
</div>


                    <div class="form-group">
                        <label for="comment">Comment (optional)</label>
                        <textarea id="comment"
                                  name="comment"
                                  rows="5"
                                  maxlength="1000"
                                  placeholder="Describe your experience..."></textarea>
                    </div>

                    <button type="submit" class="dashboard-button">
                        Submit Review
                    </button>

                    <a href="{{ url_for('my_requests') }}"
                       class="dashboard-button">
                        Cancel
                    </a>
                </form>
            </div>
        </div>
    </section>

    <footer class="footer">
        <p>&copy; 2026 HudumaLink. All rights reserved.</p>
    </footer>

</body>
</html>
